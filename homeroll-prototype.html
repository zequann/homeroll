<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homeroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: prototype bar on top; signed-out = sign-in split; owner = sidebar console; worker = phone frame; lender = single dashboard; lab and chain view are public pages */
:root{
  --bg:#EBF0EE; --surface:#FFFFFF; --surface-2:#F3F6F5; --ink:#13201C; --muted:#56655F; --line:#D2DBD7;
  --accent:#0A6B5B; --accent-ink:#FFFFFF; --accent-soft:#D3EBE4;
  --ok:#1C7A3B; --ok-soft:#DDF1E3; --danger:#B0262E; --danger-soft:#FAE3E3; --warn:#8C5400; --warn-soft:#FAEED6;
  --bar:#13201C; --bar-ink:#E4EDEA; --phone:#0F1715; --phone-screen:#FAFCFB;
  --f-display:'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
  --f-body:'Public Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#162019; --surface-2:#1C2724; --ink:#E4EDEA; --muted:#97A8A2; --line:#2B3834;
  --accent:#4FC7AE; --accent-ink:#0B1A16; --accent-soft:#143A32;
  --ok:#5BCB7A; --ok-soft:#173523; --danger:#F07A80; --danger-soft:#3A1C1F; --warn:#E3AA4E; --warn-soft:#382B14;
  --bar:#050A09; --bar-ink:#C9D6D2; --phone:#05090A; --phone-screen:#18221F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#162019; --surface-2:#1C2724; --ink:#E4EDEA; --muted:#97A8A2; --line:#2B3834;
  --accent:#4FC7AE; --accent-ink:#0B1A16; --accent-soft:#143A32;
  --ok:#5BCB7A; --ok-soft:#173523; --danger:#F07A80; --danger-soft:#3A1C1F; --warn:#E3AA4E; --warn-soft:#382B14;
  --bar:#050A09; --bar-ink:#C9D6D2; --phone:#05090A; --phone-screen:#18221F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
code,.mono{font-family:var(--f-mono);font-size:.86em}
.wrap{max-width:1260px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.pbar{background:var(--bar);color:var(--bar-ink);font-size:12.5px}
.pbar .wrap{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding-block:8px}
.pbar .grp{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.pbar b{font-family:var(--f-display);font-size:14px;color:var(--bar-ink)}
.pbar .clock{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pbtn{font:inherit;font-size:12.5px;color:var(--bar-ink);background:transparent;border:1px solid color-mix(in srgb,var(--bar-ink) 30%,transparent);border-radius:7px;padding:4px 9px;cursor:pointer}
.pbtn:hover{border-color:var(--bar-ink)}
.pbtn.on{background:var(--bar-ink);color:var(--bar)}
.pbtn.warn{border-color:#E3AA4E;color:#E3AA4E}

.btn{font:inherit;font-weight:600;font-size:14px;padding:9px 15px;border-radius:9px;border:1px solid transparent;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.info{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.mock{background:transparent;border:1px dashed var(--warn);color:var(--warn)}
.stack{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}

.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:600}
.input,select.input{font:inherit;font-size:15px;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-width:0}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.err{font-size:12.5px;color:var(--danger)}
.hint{font-size:12.5px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}

.tbl-wrap{overflow-x:auto;min-width:0}
.tbl-wrap.tall{max-height:440px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td .sub{display:block;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
tr.hl td{background:var(--accent-soft)}
tr.bad td{background:var(--danger-soft)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:13px 15px;min-width:0}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi strong{display:block;font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.kpis{grid-template-columns:1fr}}

.result{border-radius:10px;padding:13px 15px;display:grid;gap:6px}
.result.good{background:var(--ok-soft)}
.result.bad{background:var(--danger-soft)}
.result.warn{background:var(--warn-soft)}
.result .big{font-family:var(--f-display);font-size:21px;font-weight:700}
.result code{background:none;font-size:12.5px;overflow-wrap:anywhere}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.fig span{display:block;font-size:12px;color:var(--muted)}
.fig strong{font-family:var(--f-mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}

/* sign in */
.login{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;padding-block:36px 56px;align-items:start}
@media (max-width:900px){.login{grid-template-columns:minmax(0,1fr);gap:24px;padding-block:24px 40px}}
.brand{display:flex;gap:12px;align-items:center}
.mark{width:46px;height:46px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px;flex:none}
.hero h1{font-size:clamp(36px,6vw,58px);letter-spacing:-.03em;margin-top:22px}
.hero .tag{font-family:var(--f-display);font-size:20px;color:var(--accent);margin-top:6px}
.hero p.lede{color:var(--muted);max-width:52ch;margin-top:14px}
.steps3{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:10px;counter-reset:s}
.steps3 li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.steps3 li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--f-mono)}
.steps3 b{display:block}
.steps3 span{color:var(--muted);font-size:14px}
.crypto{margin-top:22px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:14px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:10px;border:1px solid var(--line)}
.tabs button{flex:1;font:inherit;font-weight:600;font-size:14px;padding:8px 6px;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.demo-acc table td{vertical-align:middle}
.mocksms{border:1px dashed var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px;background:var(--warn-soft)}
.mocksms b{font-family:var(--f-mono);letter-spacing:.12em}

/* owner shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:20px;padding-block:20px 56px;align-items:start}
.side{position:sticky;top:12px;display:grid;gap:14px}
.co{display:grid;gap:2px}
.co b{font-family:var(--f-display);font-size:16px}
.nav{display:grid;gap:2px}
.nav button{font:inherit;text-align:left;padding:8px 11px;border-radius:8px;border:0;background:transparent;color:var(--ink);cursor:pointer;font-size:14.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button:hover{background:var(--surface-2)}
.who{font-size:13px;display:grid;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.content{min-width:0;display:grid;gap:16px}
.banner{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:9px 13px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.banner b{font-weight:700}
.page-h{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-end}
.page-h h2{font-size:26px;letter-spacing:-.015em}
.page-h p{color:var(--muted);max-width:68ch}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:14px;padding-block:14px 40px}
  .side{position:static}
  .nav{display:flex;overflow-x:auto;gap:4px;padding-bottom:2px}
  .nav button{white-space:nowrap;flex:none}
  .who{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center}
}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
@media (max-width:1020px){.split{grid-template-columns:minmax(0,1fr)}}
.inv-list{display:grid;gap:8px}
.inv-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font:inherit;color:inherit;cursor:pointer}
.inv-row[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.inv-row .id{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.inv-row .iamt{font-family:var(--f-mono);font-weight:600;text-align:right}
.inv-row .chip{justify-self:end}
.doc{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:var(--surface-2);font-size:13.5px}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 16px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere;text-align:right;font-variant-numeric:tabular-nums}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.checks li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.checks b{display:block;font-size:13.5px}
.checks small{display:block;color:var(--muted);font-size:12.5px}
.ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--line);color:var(--muted)}
.ic.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ic.fail{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.ic.warn{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.ic.run{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.todo{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.todo li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.calls{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.calls li{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;background:var(--surface-2);font-size:13px}

/* worker */
.wview{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;padding-block:24px 56px;align-items:start}
.wside{display:grid;gap:12px;max-width:520px}
.wside h2{font-size:24px}
.phone{width:min(360px,100%);margin:0 auto;background:var(--phone);border-radius:40px;padding:11px}
.screen{background:var(--phone-screen);border-radius:30px;min-height:640px;display:flex;flex-direction:column;overflow:hidden}
.sc-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);padding:14px 18px 6px}
.sc-top b{font-family:var(--f-display);font-size:14px;color:var(--accent)}
.sc-body{flex:1;padding:6px 16px 16px;display:flex;flex-direction:column;gap:12px}
.wtabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface)}
.wtabs button{font:inherit;font-size:12px;font-weight:600;padding:10px 4px 12px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.wtabs button[aria-current="page"]{color:var(--accent)}
.bal{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:16px}
.bal span{font-size:12px;opacity:.85}
.bal strong{display:block;font-family:var(--f-display);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;margin:2px 0}
.bal small{font-family:var(--f-mono);font-size:11px;opacity:.85;overflow-wrap:anywhere}
.ph-card{border:1px dashed var(--line);border-radius:14px;padding:12px;font-size:13px}
.ph-card b{display:block}
.ph-card p{color:var(--muted)}
.ph-sub{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.act{list-style:none;padding:0;margin:0}
.act li{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.act small{display:block;color:var(--muted);font-size:11.5px}
.act .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.act .plus{color:var(--ok)}
.to{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--surface-2)}
.to b{display:block;font-size:14px}
.to small{font-size:12px;color:var(--muted)}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.amt{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--surface)}
.amt:focus-within{border-color:var(--accent)}
.amt span{font-weight:600;color:var(--muted)}
.amt input{border:0;background:transparent;font-family:var(--f-display);font-size:28px;font-weight:700;width:100%;color:var(--ink);min-width:0}
.amt input:focus{outline:none}
.cmp{display:grid;gap:4px}
.cmp-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;padding:7px 10px;border-radius:10px;background:var(--surface-2);font-size:12.5px}
.cmp-row.best{background:var(--accent-soft)}
.cmp-row .v{font-family:var(--f-mono);text-align:right;font-weight:600}
.cmp-row .c{color:var(--muted);font-size:11.5px}
.cmp-row .d{color:var(--danger);font-size:11.5px;text-align:right;font-family:var(--f-mono)}
.leg{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;display:grid;gap:6px}
.leg-h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.quote{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);font-size:12.5px}
.quote.wait{border-style:dashed;color:var(--muted)}
.quote.win{border-color:var(--accent);background:var(--accent-soft)}
.quote .v{font-family:var(--f-mono);font-weight:600}
.done-ic{width:52px;height:52px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:26px;font-weight:700}
.big-n{font-family:var(--f-display);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.tl{list-style:none;padding:0;margin:0}
.tl li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.tl .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px}
.tl .t{font-family:var(--f-mono);color:var(--muted)}
.opt{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:13.5px}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.ph-foot{font-size:11.5px;color:var(--muted);margin-top:auto}
@media (max-width:820px){.wview{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:14px 40px}.wside{order:2}}
@media (max-width:420px){.phone{padding:0;background:transparent;border-radius:0}.screen{border-radius:16px;border:1px solid var(--line)}}

/* lab, chain */
.pg{padding-block:24px 56px;display:grid;gap:18px}
.att-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.att{display:flex;flex-direction:column;gap:10px}
.att h3{font-size:17px}
.att blockquote{margin:0;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:13px}
.tr{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-size:13px}
.tr li{border-left:3px solid var(--line);padding:2px 0 2px 10px;border-radius:0}
.tr li.block{border-left-color:var(--danger)}
.tr li.ok{border-left-color:var(--ok)}
.tr li.agent{border-left-color:var(--warn)}
.tr b{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tr code{display:block;overflow-wrap:anywhere;margin-top:2px}
.tr li.block code{color:var(--danger)}
.att .btn{align-self:flex-start;margin-top:auto}
.st-ok{color:var(--ok);font-weight:600}
.st-bad{color:var(--danger);font-weight:600}

.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:50;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13.5px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast.bad{background:var(--danger);color:#fff}
.toast.sms{background:var(--warn-soft);color:var(--ink);border:1px dashed var(--warn)}
@media (prefers-reduced-motion:reduce){.ic.run{animation:none}}
</style>

function precheck(period,lines,when,treasury){
  // mirrors payroll.run_payroll rules (SPEC §7.3), in the same order
  for(let i=0;i<lines.length;i++){const p=S.payees[lines[i].acct];if(!p||when<p.active_from)return {code:`ERR_PAYEE_NOT_ACTIVE:${i}:${full(lines[i].acct)}`,i}}
  for(let i=0;i<lines.length;i++){const p=S.payees[lines[i].acct];if(lines[i].amount>p.cap)return {code:`ERR_ABOVE_WAGE_CAP:${i}:${full(lines[i].acct)}`,i}}
  for(let i=0;i<lines.length;i++){if(S.emp.paid[period+'|'+lines[i].acct])return {code:`ERR_ALREADY_PAID:${i}:${full(lines[i].acct)}`,i}}
  const sum=lines.reduce((s,l)=>s+l.amount,0);
  if(sum>treasury-BUFFER)return {code:'ERR_BELOW_BUFFER',i:-1,short:sum+BUFFER-treasury};
  return null;
}
function explain(err){
  if(!err)return '';const [c,i,a]=err.code.split(':');const n=a?nameOf(a):null,line=i!==undefined?`Line ${+i+1}`:'';
  return {ERR_PAYEE_NOT_ACTIVE:`${line}${n?', '+n:''}: not an active payee. New payees wait 48 hours.`,ERR_ABOVE_WAGE_CAP:`${line}${n?', '+n:''}: above the contract wage cap. Nothing was paid.`,ERR_ALREADY_PAID:`${line}${n?', '+n:''}: already paid for this month.`,ERR_BELOW_BUFFER:`Not enough in the treasury. Short by ${rm(err.short||0)} after keeping the ${rm(BUFFER)} buffer. Take an advance first.`,ERR_TOO_MANY_LINES:'Too many lines in one call.'}[c]||c;
}

function signIn(s){SES=s;store.set(SKEY,s);U.loginErr={};U.otp=null;U.page=null;U.otab='dash';U.wtab='home';U.send={step:'form',amt:800,shown:0,err:''};U.cash={step:'form',amt:200,dest:'tng',err:''};render();window.scrollTo(0,0)}
function findPhone(p){const d=p.replace(/\D/g,'');return Object.keys(S.accounts).find(a=>S.accounts[a].phone.replace(/\D/g,'')===d)}
function genAcct(){const c='abcdefghijkmnpqrstuvwxyz23456789';let a;do{a='w-';for(let i=0;i<6;i++)a+=c[Math.floor(Math.random()*c.length)]}while(S.accounts[a]);return a}
async function verify(){
  const x=invById(U.sel);if(S.inv[x.id].status!=='new'||U.check[x.id])return;
  const id=U.run;U.busy=true;U.check[x.id]={step:0,done:false};render();
  for(let i=0;i<4;i++){await wait(600);if(id!==U.run)return;U.check[x.id].step=i+1;render()}
  tick(2);const st=S.inv[x.id];st.grade=x.grade;st.hash=hex('v1|'+x.id,64);st.att=hex('att|'+x.id,64);st.status=x.grade==='D'?'declined':'attested';
  log({signer:'agent.'+ROOT,rcv:'pool.'+ROOT,method:`attest_invoice(${st.hash.slice(0,8)}…, "${x.grade}")`,gas:'agent.'+ROOT,note:`${x.id} (${x.buyer}) graded ${x.grade} after private extraction on NEAR AI Cloud`,scope:'inv'});
  U.check[x.id].done=true;delete U.check[x.id];U.busy=false;save();render();
  toast(x.grade==='D'?`${x.id} declined: failed e-invoice and delivery checks.`:`${x.id} graded ${x.grade}. You can request an advance.`);
}
function requestAdvance(rmAmt){
  const x=invById(U.sel),st=S.inv[x.id],g=GRADES[st.grade];
  const amt=Math.round(rmAmt*100);U.advErr=null;
  if(!(amt>0)){U.advErr={code:'Invalid amount',msg:'Enter an amount in ringgit, for example 120000.'};render();return}
  const cap=Math.floor(x.amount*Math.min(g.max,HARD_MAX)/10000);
  const fail=(code,msg)=>{tick(1);log({signer:OWNER.acct,rcv:'pool.'+ROOT,method:`request_advance(${st.hash.slice(0,8)}…)`,ok:false,err:code,note:`Advance of ${rm(amt)} on ${x.id} rejected`,scope:'inv'});U.advErr={code,msg};save();render()};
  if(amt>cap)return fail('ERR_ADVANCE_ABOVE_CAP',`Grade ${st.grade} allows up to ${rm(cap)}. The pool contract rejected ${rm(amt)}.`);
  if(amt>S.pool.cash)return fail('ERR_POOL_INSUFFICIENT','The lender pool does not have that much cash right now.');
  if((S.exposure[x.bk]||0)+amt>MAX_BUYER)return fail('ERR_BUYER_EXPOSURE','Too much already advanced against this buyer.');
  const fee=Math.ceil(amt*g.fee/10000);tick(3);
  Object.assign(st,{status:'advanced',advance:amt,fee});S.pool.cash-=amt;S.pool.out+=amt;S.exposure[x.bk]=(S.exposure[x.bk]||0)+amt;S.emp.treasury+=amt;
  log({signer:OWNER.acct,rcv:'pool.'+ROOT,method:`request_advance(${st.hash.slice(0,8)}…)`,note:`Advance on ${x.id} accepted, fee ${rm2(fee)}`,scope:'inv'});
  log({signer:'pool.'+ROOT,rcv:'tusdc.'+ROOT,method:'ft_transfer_call',from:'pool.'+ROOT,to:'payroll.'+ROOT,amt,note:`Advance into Perabot Jaya's payroll treasury`,scope:'inv'});
  save();render();toast(`${rm(amt)} is in your payroll treasury.`);
}
async function settle(){
  const x=invById(U.sel),st=S.inv[x.id];if(st.status!=='advanced')return;
  U.busy=true;at(x.dueTs);const rest=x.amount-st.advance-st.fee;
  log({signer:'escrow.'+ROOT,rcv:'tusdc.'+ROOT,method:'ft_transfer_call (settle)',from:'escrow.'+ROOT,to:'pool.'+ROOT,amt:x.amount,note:`${x.buyer} paid ${x.id} into escrow (mock bank)`,scope:'inv'});
  tick(1);S.pool.cash+=st.advance+st.fee;S.pool.out-=st.advance;S.pool.fees+=st.fee;S.exposure[x.bk]-=st.advance;S.emp.treasury+=rest;st.status='settled';
  log({signer:'pool.'+ROOT,rcv:'tusdc.'+ROOT,method:'ft_transfer_call',from:'pool.'+ROOT,to:'payroll.'+ROOT,amt:rest,note:`Pool repaid ${rm2(st.advance+st.fee)}; rest to Perabot Jaya`,scope:'inv'});
  U.busy=false;save();render();toast(`Pool repaid first. ${rm2(rest)} added to your treasury.`);
}
async function runPayroll(){
  const period=U.period;if(S.emp.paid[period]||U.pay)return;
  const p=PERIODS[period],{lines,when}=runLines(period),pc=precheck(period,lines,when,S.emp.treasury);
  if(pc){render();return}
  at(when);
  const id=U.run;U.busy=true;U.pay={period,call:0};render();
  const calls=Math.ceil(lines.length/MAX_LINES);
  for(let c=0;c<calls;c++){
    U.pay.call=c;render();await wait(700);if(id!==U.run)return;
    const chunk=lines.slice(c*MAX_LINES,(c+1)*MAX_LINES),sum=chunk.reduce((s,l)=>s+l.amount,0);
    S.emp.treasury-=sum;S.emp.onboarding=false;
    log({signer:OWNER.acct+' (payroll agent key)',rcv:'payroll.'+ROOT,method:`run_payroll("${period}", ${chunk.length} lines)`,gas:OWNER.acct,note:`Call ${c+1} of ${calls}: ${chunk.length} workers, ${rm(sum)}`,scope:'emp'});
    chunk.forEach(l=>{S.emp.paid[period+'|'+l.acct]=true;S.bal[l.acct]=(S.bal[l.acct]||0)+l.amount;wPush(l.acct,`${p.label.split(' ')[0]} wage`,`From ${OWNER.company} · ${fShort(S.now)}, on time`,l.amount);
      log({signer:'payroll.'+ROOT,rcv:'tusdc.'+ROOT,method:'ft_transfer',from:'payroll.'+ROOT,to:full(l.acct),amt:l.amount,note:`Wage: ${S.accounts[l.acct].name}`,scope:'emp'})});
    save();
  }
  S.emp.paid[period]=true;S.emp.runs[period]={t:S.now,total:lines.reduce((s,l)=>s+l.amount,0),count:lines.length};
  U.pay=null;U.busy=false;save();render();toast(`${lines.length} workers paid for ${p.label}.`);
}
function addWorker(){
  const v=id=>$('#'+id).value.trim(),e={};
  const name=v('aw-n'),phone=v('aw-p'),country=v('aw-c'),role=v('aw-r')||'Worker',wage=Math.round(+v('aw-w')*100),cap=Math.round(+v('aw-k')*100);
  if(name.length<2)e.n='Enter the worker\'s full name.';
  const d=phone.replace(/\D/g,'');
  if(!/^601\d{8,9}$/.test(d))e.p='Enter a Malaysian mobile number, like +60 10-000 2001.';else if(findPhone(phone))e.p='That phone number is already registered.';
  if(!(wage>0))e.w='Enter the net wage in ringgit.';
  if(!(cap>0))e.k='Enter the contract cap in ringgit.';else if(wage>cap)e.k='The net wage cannot be above the contract cap.';
  U.addErr=e;if(Object.keys(e).length){render();return}
  const a=genAcct(),pretty='+'+d.slice(0,2)+' '+d.slice(2,4)+'-'+d.slice(4,7)+' '+d.slice(7);
  S.accounts[a]={name,country,role,phone:pretty,family:country==='Bangladesh'?{label:'Family',wallet:'bKash •••• '+d.slice(-4),city:'Dhaka'}:null};
  const hold=!S.emp.onboarding;S.payees[a]={wage,cap,active_from:hold?S.now+HOLD:0};S.order.push(a);tick(1);
  log({signer:ROOT,rcv:ROOT,method:`create_worker("${a}")`,note:`Account created for ${name}`,scope:'emp'});
  log({signer:OWNER.acct,rcv:'payroll.'+ROOT,method:`add_payee("${full(a)}", cap)`,note:hold?`${name} added, active after the 48-hour hold`:`${name} added during onboarding, active now`,scope:'emp'});
  save();render();toast(`${esc(name)} added as ${a}. ${hold?'Active after 48 hours.':'Active now.'} They can sign in with ${esc(pretty)}.`);
}
function remitSend(){
  const a=SES.acct,w=S.accounts[a],amt=Math.round((+U.send.amt||0)*100),err=relayCheck(a,amt);
  if(err){U.send.err=err;render();return}
  const ours=BEST+PARTNER_FEE,b=amt/100*(1-ours)*BDT,saved=amt/100*(0.0751-ours)*BDT;tick(2);
  S.bal[a]-=amt;S.daily[a+'|'+dayKey(S.now)]=dailyUsed(a)+amt;
  log({signer:full(a),rcv:'tusdc.'+ROOT,method:'ft_transfer',from:full(a),to:'payout.'+ROOT,amt,gas:'relayer.'+ROOT,note:'Send home',scope:'worker'});
  wPush(a,`Sent to ${w.family.label}`,`${bdt(b)} to ${w.family.wallet}`,-amt);
  U.send={step:'done',amt:U.send.amt,shown:0,err:'',res:{bdt:b,saved,amt,t:S.now,solver:SOLVERS.find(s=>s[1]===BEST)[0]}};save();render();
}
async function getQuote(){
  const a=SES.acct,val=$('#samt').value.trim();U.send.amt=val;const amt=Math.round((+val||0)*100),err=relayCheck(a,amt);
  if(err){U.send.err=err;render();return}
  const id=U.run;U.send.err='';U.send.step='quote';U.send.shown=0;U.busy=true;render();
  for(let i=1;i<=3;i++){await wait(550);if(id!==U.run||U.send.step!=='quote')return;U.send.shown=i;render()}
  U.busy=false;render();
}
function cashOut(){
  const a=SES.acct,w=S.accounts[a],c=U.cash;c.amt=$('#camt').value.trim();c.dest=(document.querySelector('input[name="dest"]:checked')||{}).value||'tng';
  const amt=Math.round((+c.amt||0)*100),err=relayCheck(a,amt);if(err){c.err=err;render();return}
  tick(1);S.bal[a]-=amt;S.daily[a+'|'+dayKey(S.now)]=dailyUsed(a)+amt;const ref='DN'+hex('dn'+S.seq,10).toUpperCase();
  const dest=c.dest==='tng'?'Touch \'n Go eWallet':'Maybank savings';
  log({signer:full(a),rcv:'tusdc.'+ROOT,method:'ft_transfer',from:full(a),to:'offramp.'+ROOT,amt,gas:'relayer.'+ROOT,note:'Cash out',scope:'worker'});
  wPush(a,'Cashed out',`${dest} · DuitNow ${ref}`,-amt);
  U.cash={step:'done',amt:c.amt,dest:c.dest,err:'',res:{amt,dest,ref}};save();render();
}
function lenderDeposit(){
  const v=+$('#dep').value,sen=Math.round(v*FX*100);
  if(!(v>0)){U.lenderMsg={dep:{t:'Enter an amount in USDC.'}};render();return}
  if(sen>S.pool.wallet){U.lenderMsg={dep:{t:`Your wallet has ${usdc(S.pool.wallet)} tUSDC.`}};render();return}
  const sh=Math.floor(sen*S.pool.total/nav());S.pool.wallet-=sen;S.pool.cash+=sen;S.pool.total+=sh;S.pool.shares[LENDER.acct]+=sh;tick(1);
  log({signer:LENDER.acct,rcv:'tusdc.'+ROOT,method:'ft_transfer_call (deposit)',from:LENDER.acct,to:'pool.'+ROOT,amt:sen,note:'Lender deposit',scope:'pool'});
  U.lenderMsg={dep:{ok:true,t:`Deposited ${money(v,2)} USDC. ${money(sh/100,2)} shares minted at the current NAV.`}};save();render();
}
function lenderWithdraw(){
  const v=+$('#wd').value,sen=Math.round(v*FX*100);
  if(!(v>0)){U.lenderMsg={wd:{t:'Enter an amount in USDC.'}};render();return}
  if(sen>myValue()){U.lenderMsg={wd:{t:`Your position is worth ${usdc(myValue())} USDC.`}};render();return}
  tick(1);
  if(sen>S.pool.cash){log({signer:LENDER.acct,rcv:'pool.'+ROOT,method:'withdraw_lender',ok:false,err:'ERR_POOL_INSUFFICIENT',note:'Withdrawal above available cash',scope:'pool'});U.lenderMsg={wd:{t:'ERR_POOL_INSUFFICIENT: the pool does not have that much cash right now. Money lent to SMEs comes back when buyers pay.'}};save();render();return}
  const sh=Math.ceil(sen*S.pool.total/nav());S.pool.shares[LENDER.acct]-=sh;S.pool.total-=sh;S.pool.cash-=sen;S.pool.wallet+=sen;
  log({signer:LENDER.acct,rcv:'pool.'+ROOT,method:'withdraw_lender',from:'pool.'+ROOT,to:LENDER.acct,amt:sen,note:'Lender withdrawal',scope:'pool'});
  U.lenderMsg={wd:{ok:true,t:`Withdrew ${money(v,2)} USDC to your wallet.`}};save();render();
}
async function runAttack(aid){
  const a=ATTACKS.find(x=>x.id===aid),steps=a.steps(),id=U.run;U.lab[aid]={steps,shown:0};render();
  for(let i=1;i<=steps.length;i++){await wait(520);if(id!==U.run)return;U.lab[aid].shown=i;render()}
}
const ACT={
  page:x=>{U.page=x||null;render();window.scrollTo(0,0)},
  ltab:x=>{U.ltab=x;U.loginErr={};U.otp=null;render()},
  fill:x=>{
    if(x==='owner'){U.ltab='owner';U.otp=null;render();$('#oe').value=OWNER.email;$('#op').value=OWNER.password}
    else if(x==='lender'){U.ltab='lender';U.otp=null;render();$('#le').value=LENDER.email;$('#lp').value=LENDER.password}
    else{U.ltab='worker';U.otp=null;render();$('#ph').value=allWorkers()[+x.slice(1)].phone}
    window.scrollTo({top:0,behavior:REDUCE?'auto':'smooth'});
  },
  otpBack:()=>{U.otp=null;U.loginErr={};render()},
  otpResend:()=>{U.otp.code=String(100000+Math.floor(Math.random()*900000));U.loginErr={};render();toast(`Mock SMS · Your Homeroll code is <b>${U.otp.code}</b>`,'sms')},
  logout:()=>{SES=null;store.del(SKEY);U.run++;U.busy=false;U.pay=null;U.page=null;render();window.scrollTo(0,0)},
  reset:()=>{if(!U.resetArm){U.resetArm=true;render();setTimeout(()=>{if(U.resetArm){U.resetArm=false;render()}},4000);return}
    U.resetArm=false;U.run++;U.busy=false;U.pay=null;U.check={};U.lab={};U.advErr=null;U.advAmt={};U.addErr={};U.removing=null;U.lenderMsg={};U.period='2026-10';U.send={step:'form',amt:800,shown:0,err:''};U.cash={step:'form',amt:200,dest:'tng',err:''};S=seed();save();render();toast('Demo reset to Mon 20 Oct 2026.')},
  ff:()=>{S.now+=HOLD;save();render();toast('Clock moved forward 48 hours.')},
  otab:x=>{U.otab=x;U.removing=null;render();window.scrollTo(0,0)},
  sel:x=>{U.sel=x;U.advErr=null;render()},
  verify, settle, payroll:runPayroll,
  remove:x=>{U.removing=x;render()},
  removeYes:x=>{const n=S.accounts[x].name;delete S.payees[x];U.removing=null;tick(1);log({signer:OWNER.acct,rcv:'payroll.'+ROOT,method:`remove_payee("${full(x)}")`,note:`${n} removed as a payee`,scope:'emp'});save();render();toast(`${esc(n)} removed. Their wallet still exists.`)},
  wtab:x=>{U.wtab=x;if(x==='send'&&U.send.step==='done')U.send={step:'form',amt:800,shown:0,err:''};if(x==='cash'&&U.cash.step==='done')U.cash={step:'form',amt:200,dest:'tng',err:''};render()},
  send:remitSend,
  sendBack:()=>{U.send.step='form';U.send.shown=0;U.busy=false;render()},
  sendNew:()=>{U.send={step:'form',amt:800,shown:0,err:''};U.wtab='home';render()},
  cashNew:()=>{U.cash={step:'form',amt:200,dest:'tng',err:''};U.wtab='home';render()},
  attack:runAttack,
  cf:x=>{U.chainFilter=x;render()}
};
const FORMS={
  ownerLogin:()=>{const e=$('#oe').value.trim().toLowerCase(),p=$('#op').value;
    if(!e)U.loginErr={owner:'Enter your work email.'};else if(e!==OWNER.email)U.loginErr={owner:'No business account uses that email. Try the demo account below.'};else if(p!==OWNER.password)U.loginErr={owner:'Wrong password. The demo password is shown below.'};else return signIn({role:'owner'});render()},
  lenderLogin:()=>{const e=$('#le').value.trim().toLowerCase(),p=$('#lp').value;
    if(!e)U.loginErr={lender:'Enter your email.'};else if(e!==LENDER.email)U.loginErr={lender:'No lender account uses that email.'};else if(p!==LENDER.password)U.loginErr={lender:'Wrong password. The demo password is shown below.'};else return signIn({role:'lender'});render()},
  otpSend:()=>{const ph=$('#ph').value.trim();if(!ph){U.loginErr={phone:'Enter your phone number.'};render();return}
    const a=findPhone(ph);if(!a){U.loginErr={phone:'This number is not registered by any employer. Ask your employer to add you.'};render();return}
    U.otp={phone:S.accounts[a].phone,acct:a,code:String(100000+Math.floor(Math.random()*900000)),tries:0};U.loginErr={};render();toast(`Mock SMS · Your Homeroll code is <b>${U.otp.code}</b>`,'sms');const c=$('#oc');if(c)c.focus()},
  otpVerify:()=>{const c=$('#oc').value.trim();if(!/^\d{6}$/.test(c)){U.loginErr={otp:'Enter the 6-digit code.'};render();return}
    if(c!==U.otp.code){U.otp.tries++;U.loginErr={otp:U.otp.tries>=3?'Too many wrong codes. Send a new code.':'That code is not right. Check the mock SMS above.'};render();return}
    signIn({role:'worker',acct:U.otp.acct})},
  advance:()=>{const v=$('#advAmt').value.replace(/[^\d.]/g,'');U.advAmt=U.advAmt||{};U.advAmt[U.sel]=v;requestAdvance(+v)},
  addWorker, quote:getQuote, cashout:cashOut, deposit:lenderDeposit, withdraw:lenderWithdraw
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){if(b.dataset.act!=='reset'&&U.resetArm){U.resetArm=false}f(b.dataset.arg)}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const h=FORMS[f.dataset.form];if(h)h()});
document.addEventListener('change',e=>{if(e.target.dataset.change==='period'){U.period=e.target.value;render()}});
document.addEventListener('input',e=>{
  if(e.target.id==='samt'){const v=Math.round((+e.target.value||0)*100);U.send.amt=e.target.value;const c=$('#cmp');if(c)c.innerHTML=cmpRows(v)}
  if(e.target.id==='advAmt'&&SES&&SES.role==='owner'){const st=S.inv[U.sel],g=GRADES[st.grade]||GRADES.A,v=Math.round((+e.target.value.replace(/[^\d.]/g,'')||0)*100);const f=$('#advFee');if(f)f.textContent=`${rm2(Math.ceil(v*g.fee/10000))} (${(g.fee/100).toFixed(1)}%)`}
});
render();
</script>
